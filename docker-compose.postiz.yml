version: '3.8'

# ==============================================================================
# Centralized Postiz Social Media Automation Stack for Coolify
# Compatible with Postiz latest + lightweight Temporal on SQLite
# Serves: https://social.aisimplesystem.com
# ==============================================================================

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz-app
    restart: always
    environment:
      # Public Domains
      MAIN_URL: "https://social.aisimplesystem.com"
      FRONTEND_URL: "https://social.aisimplesystem.com"
      NEXT_PUBLIC_BACKEND_URL: "https://social.aisimplesystem.com/api"
      
      # Core Settings
      PORT: "3000"
      JWT_SECRET: "super_secret_jwt_postiz_token_key_aisimplesystem_2026"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      
      # Storage Settings
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      
      # Internal Service Connections
      DATABASE_URL: "postgresql://postiz:postiz_secure_pass_2026@postiz-postgres:5432/postiz?schema=public"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      TEMPORAL_ADDRESS: "temporal:7233"
    volumes:
      - postiz_config:/config/
      - postiz_uploads:/uploads/
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - postiz-network
    expose:
      - 3000
      - 5000

  temporal:
    image: temporalio/temporal:latest
    container_name: postiz-temporal
    restart: always
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/tmp/temporal.db"]
    networks:
      - postiz-network
    expose:
      - 7233

  postiz-postgres:
    image: postgres:16-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: postiz_secure_pass_2026
      POSTGRES_DB: postiz
    volumes:
      - postiz_pgdata:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz"]
      interval: 5s
      timeout: 5s
      retries: 5

  postiz-redis:
    image: redis:7-alpine
    container_name: postiz-redis
    restart: always
    volumes:
      - postiz_redisdata:/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postiz_config:
  postiz_uploads:
  postiz_pgdata:
  postiz_redisdata:

networks:
  postiz-network:
    driver: bridge
